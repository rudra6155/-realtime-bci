name: ci
on: [push, pull_request]

jobs:
  test-cpu:
    # GitHub-hosted runners have no GPU: CUDA-only tests are skipped (REQUIRE_CUDA=0), so a green
    # run here says nothing about GPU latency, CUDA streams or the CUDA ONNX provider.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Test
        run: make test REQUIRE_CUDA=0
