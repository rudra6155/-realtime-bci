[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-bci"
version = "0.1.0"
description = "Real-time, GPU-accelerated EEG decoding pipeline (synthetic data): ring buffer -> pinned memory -> CUDA streams -> Riemannian/LDA classifier -> live dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # On Windows the default PyPI wheel is CPU-only; install a CUDA build first (see README).
    "torch>=2.5",
    "onnx>=1.16",
    # 1.21-1.26 are built for CUDA 12.8 (cuDNN 9); 1.27+ default to CUDA 13 and fail to load next to a CUDA 12.x torch.
    "onnxruntime-gpu>=1.21,<1.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "streamlit>=1.37",
    "plotly>=5.18",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# real EEG (BCI Competition IV 2a via MOABB) and Lab Streaming Layer
real = [
    "moabb>=1.2",
    "pylsl>=1.16",
]
dev = [
    "pytest>=8",
    "playwright>=1.44",
    "httpx>=0.27",
    "pillow>=10",
    "moabb>=1.2",
    "pylsl>=1.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA device (skipped without one unless BCI_REQUIRE_CUDA=1, then it fails)",
]
